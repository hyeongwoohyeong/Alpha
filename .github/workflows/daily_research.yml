name: Daily Research

# 매일 한국시간 오전 7:30·오후 6:00 (UTC 22:30·09:00) 자동 실행 + 수동 트리거 가능
on:
  schedule:
    - cron: "30 22 * * *"   # 07:30 KST
    - cron: "0 9 * * *"     # 18:00 KST
  workflow_dispatch:
    inputs:
      ticker:
        description: "특정 종목만 (선택)"
        required: false
        default: ""

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write     # alpha.db 커밋을 위해 필요
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # rebase 가 가능하도록 전체 history fetch
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run research pipeline
        env:
          # Yahoo가 GitHub Actions IP를 차단하는 경우를 대비
          PYTHONUNBUFFERED: "1"
          # LLM provider — OpenAI 사용 (사용자 선택, 2026-05-03)
          # ANTHROPIC_API_KEY 는 미등록 상태로 두면 자동 비활성
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # FRED API 키 — Portfolio Regime 매크로 데이터 (미설정 시 graceful skip)
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          LLM_MODE: ${{ vars.LLM_MODE || 'low_cost' }}
          MAX_LLM_CALLS_PER_RUN: ${{ vars.MAX_LLM_CALLS_PER_RUN || '30' }}
          ENABLE_SUMMARY_CACHE: "true"
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python run_research.py --ticker "${{ github.event.inputs.ticker }}"
          else
            python run_research.py
          fi

      - name: Commit alpha.db
        run: |
          git config user.name  "alpha-bot"
          git config user.email "alpha-bot@users.noreply.github.com"
          # 파이프라인이 만든 새 DB 를 따로 보관.
          # 바이너리 SQLite 는 rebase/merge 가 불가능("Cannot merge binary files")하므로
          # rebase 를 쓰지 않는다. 매 시도마다: 워킹트리를 최신 origin/main 으로 강제
          # 초기화 → 새 DB 만 덮어쓰기 → DB 단일 변경 커밋 → fast-forward push.
          cp data/alpha.db /tmp/new_alpha.db
          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout -f -B main origin/main
            cp /tmp/new_alpha.db data/alpha.db
            git add data/alpha.db
            if git diff --cached --quiet; then
              echo "No DB changes to commit"
              exit 0
            fi
            git commit -m "chore: daily research $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin main; then
              echo "push success on try $i"
              exit 0
            fi
            echo "push rejected (try $i) — retrying..."
            sleep $((i * 3))
          done
          echo "::warning::push 5회 모두 실패 — alpha.db 는 artifact 로 업로드되어 있습니다"
          exit 0  # push 실패해도 워크플로우는 성공 처리 (데이터는 artifact 에 있음)

      - name: Upload DB artifact (백업)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-db-${{ github.run_number }}
          path: data/alpha.db
          retention-days: 14
