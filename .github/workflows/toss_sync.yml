name: Toss Portfolio Sync

# 토스증권 Open API → portfolio.json 자동 갱신.
# 3시간마다: 매일 09/12/15/18/21/00/03/06 KST = UTC 00/03/06/09/12/15/18/21
on:
  # schedule disabled — 토스 IP allowlist 강제 정책으로 GitHub Actions runner IP 차단.
  # 대신 Mac launchd cron (~/Library/LaunchAgents/com.alpha.toss_sync.plist) 사용.
  # 수동 trigger 만 유지 (디버그용).
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Toss sync
        env:
          PYTHONUNBUFFERED: "1"
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_NUMBER: ${{ secrets.TOSS_ACCOUNT_NUMBER }}
        run: |
          python scripts/toss_portfolio_sync.py

      - name: Commit portfolio.json + sync log
        if: always()
        run: |
          git config user.name "alpha-bot"
          git config user.email "alpha-bot@users.noreply.github.com"
          # 우리 update 파일 백업
          cp data/portfolio.json /tmp/our_portfolio.json 2>/dev/null || true
          cp data/toss_sync_log.json /tmp/our_log.json 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout -f -B main origin/main
            [ -f /tmp/our_portfolio.json ] && cp /tmp/our_portfolio.json data/portfolio.json
            [ -f /tmp/our_log.json ] && cp /tmp/our_log.json data/toss_sync_log.json
            git add data/portfolio.json data/toss_sync_log.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "no portfolio change"
              exit 0
            fi
            git commit -m "toss sync $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin main; then
              echo "✓ pushed (try $i)"
              exit 0
            fi
            sleep 3
          done
          echo "⚠️ push 5회 실패"
