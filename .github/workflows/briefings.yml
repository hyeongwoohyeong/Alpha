name: Daily Briefings

# 하루 3회 시황 브리핑 — 텔레그램 다이제스트 push.
# 도착 목표 시각 (KST):
#   아침 09:00 — Lead time 보정: cron 08:45 KST = UTC 23:45 (전날)
#   저녁 18:00 — cron 17:45 KST = UTC 08:45
#   밤   22:00 — cron 21:45 KST = UTC 12:45
# Lead time: GitHub Actions drift (5~10분) + workflow execution (2~3분) = 약 15분
on:
  schedule:
    - cron: "45 23 * * *"   # 09:00 KST 도착 목표 — 아침
    - cron: "45 8 * * *"    # 18:00 KST 도착 목표 — 저녁
    - cron: "45 12 * * *"   # 22:00 KST 도착 목표 — 밤
  workflow_dispatch:
    inputs:
      slot:
        description: "수동 실행 slot (morning/evening/night)"
        required: false
        default: "morning"

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # tg_freelife_state.json commit 위해
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pykrx openai anthropic

      - name: Determine slot
        id: slot
        run: |
          # cron 시간으로 slot 자동 결정 (UTC 기준 hour 추출)
          if [ -n "${{ inputs.slot }}" ]; then
            echo "value=${{ inputs.slot }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 23 ] || [ "$HOUR" -le 1 ]; then
              echo "value=morning" >> $GITHUB_OUTPUT
            elif [ "$HOUR" -ge 8 ] && [ "$HOUR" -le 10 ]; then
              echo "value=evening" >> $GITHUB_OUTPUT
            else
              echo "value=night" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run briefing
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.briefing_engine ${{ steps.slot.outputs.value }}

      - name: 프리라이프 브리핑 (신규 메시지만)
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/fetch_tg_brief.py

      - name: Commit freelife state (dedup 보존)
        if: always()
        run: |
          git config user.name "alpha-bot"
          git config user.email "alpha-bot@users.noreply.github.com"
          if [ ! -f data/tg_freelife_state.json ]; then
            echo "state file 없음 — skip"
            exit 0
          fi
          cp data/tg_freelife_state.json /tmp/our_state.json
          for i in 1 2 3; do
            git fetch origin main
            git checkout -f -B main origin/main
            cp /tmp/our_state.json data/tg_freelife_state.json
            git add data/tg_freelife_state.json
            if git diff --cached --quiet; then
              echo "state no change — skip"
              exit 0
            fi
            git commit -m "chore: freelife state $(date -u +'%H:%M UTC')"
            if git push origin main; then
              echo "✓ state pushed (try $i)"
              exit 0
            fi
            sleep 3
          done
          echo "⚠️ push 실패 — 다음 실행에서 재시도"
