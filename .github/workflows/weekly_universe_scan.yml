name: Daily Universe Scan

# 매일 새벽 03:00 KST (UTC 18:00 전날)
# 1. KR dynamic universe rebuild (전종목)
# 2. KR + US universe Confluence Score (rotation 200 종목/일)
# 3. 신규 hyper-growth 진입 종목 텔레그램 alert
# 신선도: 평균 1주 지연 (어닝 후 가속 시점 빠르게 detect)
# 비용: ~1,350분/월 (free tier 2,000분 안)
on:
  schedule:
    - cron: "0 18 * * *"   # 매일 UTC 18:00 = KST 03:00
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # 200 종목 score 약 30분
    permissions:
      contents: write       # DB commit 위해
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pykrx yfinance pandas requests finance-datareader lxml html5lib

      - name: 1) US Index Universe rebuild (S&P500 + NASDAQ100 + Russell1000)
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/build_us_index_universe.py

      - name: 2) KR Dynamic Universe rebuild
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/build_dynamic_universe.py

      - name: 3) Confluence Score Scan + Alert
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/weekly_growth_scan.py

      - name: 4) Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 -c "import sqlite3; c=sqlite3.connect('data/alpha.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close(); print('WAL checkpoint done')"
          git add data/kr_dynamic_universe.csv data/us_index_universe.csv data/alpha.db || true
          if git diff --cached --quiet; then
            echo "변경 없음 — commit skip"
          else
            git commit -m "universe scan $(date -u +'%Y-%m-%d') — SP500+NDX100+R1000+KR"
            git push origin main || git pull --rebase origin main && git push origin main
          fi
