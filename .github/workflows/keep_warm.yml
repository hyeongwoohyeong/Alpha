name: Keep Alpha Warm

# Streamlit Cloud 무료 티어가 idle 후 앱을 잠재워 매번 깨우는 데 30~60초 걸리는
# 문제 우회 — 15분마다 짧은 HTTP GET 으로 앱을 깨어있는 상태로 유지.
# (GitHub Actions cron 은 ±10분 정도 드리프트 — 실제 간격은 15~30분.)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Streamlit app
        run: |
          # curl: 최대 30s, 응답 본문 무시. 비-2xx 응답이어도 wake-up 효과는 발생.
          # --silent --show-error 로 로그를 깔끔하게.
          curl --max-time 30 --silent --show-error -o /dev/null -w "HTTP %{http_code} · %{time_total}s\n" \
            https://xneavyytr3uh5wmahbquph.streamlit.app/ || true
          echo "Ping complete."
