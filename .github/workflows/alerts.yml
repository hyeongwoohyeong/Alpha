name: Telegram Alerts

# 1시간마다 alert_engine 실행 → 룰 체크 → 텔레그램 push.
# Note: GitHub Actions free cron 은 ±10분 드리프트 — 실제 간격 1h~1h15.
# 시간당 1회면 비용 0 (월 720분, public 무료 / private 2000분 한도 안).
on:
  schedule:
    - cron: "0 * * * *"   # 매 정시
  workflow_dispatch:       # 수동 실행 (디버그)

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # alert_dedup.json commit 위해
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pykrx

      - name: Run alert cycle
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.alert_engine

      - name: Commit alert_dedup.json (영구화) — JSON merge 지원
        if: always()
        run: |
          git config user.name "alpha-bot"
          git config user.email "alpha-bot@users.noreply.github.com"
          if [ ! -f data/alert_dedup.json ]; then
            echo "dedup file 없음 — skip"
            exit 0
          fi
          # 우리 dedup state 백업
          cp data/alert_dedup.json /tmp/our_dedup.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout -f -B main origin/main
            # origin 의 dedup file 과 *우리* dedup state JSON-level merge
            python3 -c "
import json
from pathlib import Path
ours_path = Path('/tmp/our_dedup.json')
theirs_path = Path('data/alert_dedup.json')
ours = json.load(open(ours_path)) if ours_path.exists() else {}
theirs = json.load(open(theirs_path)) if theirs_path.exists() else {}
merged = dict(theirs)
for k, v in ours.items():
    if k not in merged or v.get('sent_at', '') > merged[k].get('sent_at', ''):
        merged[k] = v
json.dump(merged, open(theirs_path, 'w'), indent=2, ensure_ascii=False)
print(f'merged: {len(merged)} entries (ours={len(ours)} + theirs={len(theirs)})')
"
            git add data/alert_dedup.json
            if git diff --cached --quiet; then
              echo "dedup no change (merge result == theirs)"
              exit 0
            fi
            git commit -m "alert dedup merge $(date -u +'%H:%M UTC')"
            if git push origin main; then
              echo "✓ dedup pushed (try $i)"
              exit 0
            fi
            echo "push fail try $i, retry..."
            sleep 3
          done
          echo "⚠️ push 5회 실패 — 다음 cycle 자동 재시도"
