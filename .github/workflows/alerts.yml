name: Telegram Alerts

# 1시간마다 alert_engine 실행 → 룰 체크 → 텔레그램 push.
# Note: GitHub Actions free cron 은 ±10분 드리프트 — 실제 간격 1h~1h15.
# 시간당 1회면 비용 0 (월 720분, public 무료 / private 2000분 한도 안).
on:
  schedule:
    - cron: "0 * * * *"   # 매 정시
  workflow_dispatch:       # 수동 실행 (디버그)

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          # alert_engine 필수 의존성만 — 가벼움
          pip install requests yfinance pykrx

      - name: Run alert cycle
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.alert_engine

      - name: Upload alert log artifact (디버그)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-db-${{ github.run_id }}
          path: data/alpha.db
          if-no-files-found: ignore
          retention-days: 7
